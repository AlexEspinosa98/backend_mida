services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mida}
      POSTGRES_USER: ${POSTGRES_USER:-mida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mida}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: psql://${POSTGRES_USER:-mida}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-mida}
      # Ruta fija del modelo horneado en la imagen (ver docker/Dockerfile) --
      # se fija aquí explícitamente para que no dependa del .env del
      # desarrollador (que puede apuntar a una ruta local fuera del contenedor).
      LLM_MODEL_PATH: /app/models/model.gguf
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    # Sin nginx propio en este compose (ver más abajo) — el nginx del sistema, compartido con
    # todos los demás backends de este servidor, reversa-proxea /api/mida/ directo a este puerto.
    # 127.0.0.1 nada más: nunca expuesto a la red pública sin pasar por ese nginx.
    ports:
      - "127.0.0.1:8007:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

volumes:
  postgres_data:
  media_data:
  static_data:
